<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
</head>
<body>
  <h1>Admin Dashboard</h1>
  <form id="priceForm">
    <input id="product" placeholder="Product" required>
    <input id="store" placeholder="Store" required>
    <input id="price" placeholder="Price" type="number" step="0.01" required>
    <button type="submit">Add Price</button>
  </form>
  <h2>Prices</h2>
  <table id="priceTable" border="1" cellpadding="5">
    <thead>
      <tr>
        <th>Product</th>
        <th>Store</th>
        <th>Price (€)</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
<script>
const api = 'http://localhost:3000';

async function loadPrices() {
  const res = await fetch(api + '/prices');
  const data = await res.json();
  const tbody = document.querySelector('#priceTable tbody');
  tbody.innerHTML = '';
  data.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input value="${p.product}" data-field="product"></td>
      <td><input value="${p.store}" data-field="store"></td>
      <td><input type="number" step="0.01" value="${p.price}" data-field="price"></td>
      <td>
        <button data-action="save" data-id="${p.id}">Save</button>
        <button data-action="delete" data-id="${p.id}">Delete</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById('priceTable').addEventListener('click', async (e) => {
  const action = e.target.dataset.action;
  const id = e.target.dataset.id;
  if (!action || !id) return;
  const row = e.target.closest('tr');
  if (action === 'delete') {
    await fetch(`${api}/prices/${id}`, { method: 'DELETE' });
  } else if (action === 'save') {
    const product = row.querySelector('[data-field="product"]').value;
    const store = row.querySelector('[data-field="store"]').value;
    const price = parseFloat(row.querySelector('[data-field="price"]').value);
    await fetch(`${api}/prices/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product, store, price })
    });
  }
  loadPrices();
});

document.getElementById('priceForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const product = document.getElementById('product').value;
  const store = document.getElementById('store').value;
  const price = parseFloat(document.getElementById('price').value);
  await fetch(api + '/prices', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ product, store, price })
  });
  e.target.reset();
  loadPrices();
});

loadPrices();
</script>
</body>
</html>
