<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pannello amministratore</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-3xl mx-auto">
    <h1 class="text-3xl font-bold mb-4 text-center">Gestione prezzi supermercati</h1>
    <p class="mb-6 text-center">Aggiorna in tempo reale il database dei prezzi per offrire agli utenti le migliori offerte disponibili.</p>
    <form id="priceForm" class="flex flex-col sm:flex-row gap-2 mb-6">
      <input id="product" class="border rounded p-2 flex-1" placeholder="Prodotto" required>
      <input id="store" class="border rounded p-2 flex-1" placeholder="Catena" required>
      <input id="price" class="border rounded p-2 w-32" placeholder="Prezzo" type="number" step="0.01" required>
      <button class="bg-blue-600 text-white px-4 py-2 rounded" type="submit">Aggiungi</button>
    </form>
    <h2 class="text-xl font-semibold mb-2">Lista prezzi</h2>
    <table id="priceTable" class="min-w-full bg-white shadow rounded overflow-hidden">
      <thead class="bg-gray-200">
        <tr>
          <th class="px-4 py-2 text-left">Prodotto</th>
          <th class="px-4 py-2 text-left">Catena</th>
          <th class="px-4 py-2 text-left">Prezzo (€)</th>
          <th class="px-4 py-2">Azioni</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
<script>
const api = 'http://localhost:3000';

async function loadPrices() {
  const res = await fetch(api + '/prices');
  const data = await res.json();
  const tbody = document.querySelector('#priceTable tbody');
  tbody.innerHTML = '';
  data.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="border-t px-4 py-2"><input class="border rounded p-1 w-full" value="${p.product}" data-field="product"></td>
      <td class="border-t px-4 py-2"><input class="border rounded p-1 w-full" value="${p.store}" data-field="store"></td>
      <td class="border-t px-4 py-2"><input class="border rounded p-1 w-full" type="number" step="0.01" value="${p.price}" data-field="price"></td>
      <td class="border-t px-4 py-2 space-x-2 text-center">
        <button class="bg-green-500 text-white px-2 py-1 rounded" data-action="save" data-id="${p.id}">Salva</button>
        <button class="bg-red-500 text-white px-2 py-1 rounded" data-action="delete" data-id="${p.id}">Elimina</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

document.getElementById('priceTable').addEventListener('click', async (e) => {
  const action = e.target.dataset.action;
  const id = e.target.dataset.id;
  if (!action || !id) return;
  const row = e.target.closest('tr');
  if (action === 'delete') {
    await fetch(`${api}/prices/${id}`, { method: 'DELETE' });
  } else if (action === 'save') {
    const product = row.querySelector('[data-field="product"]').value;
    const store = row.querySelector('[data-field="store"]').value;
    const price = parseFloat(row.querySelector('[data-field="price"]').value);
    await fetch(`${api}/prices/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product, store, price })
    });
  }
  loadPrices();
});

document.getElementById('priceForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const product = document.getElementById('product').value;
  const store = document.getElementById('store').value;
  const price = parseFloat(document.getElementById('price').value);
  await fetch(api + '/prices', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ product, store, price })
  });
  e.target.reset();
  loadPrices();
});

loadPrices();
</script>
</body>
</html>
